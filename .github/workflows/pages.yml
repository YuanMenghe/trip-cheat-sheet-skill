name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify example data (strict)
        working-directory: skills/trip-cheat-sheet
        run: node scripts/verify.mjs examples/tokyo-conference/trip.json --strict

      - name: Build multi-page demo
        working-directory: skills/trip-cheat-sheet
        run: node scripts/build.mjs examples/tokyo-conference/trip.json --multi --out ../../_site

      - name: Build single-file demo
        working-directory: skills/trip-cheat-sheet
        run: |
          node scripts/build.mjs examples/tokyo-conference/trip.json --out ../../_single --force
          cp ../../_single/index.html ../../_site/tripcheat-single.html

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
