<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="{{THEME_COLOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="generator" content="TripCheat / AI 行程规划专家">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{SHORT_TITLE}}">
<title>{{TITLE}}</title>
<link rel="icon" href="{{FAVICON}}">
{{MANIFEST_LINK}}
<style>{{CSS}}</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div id="gate" hidden></div>
<div class="app">
  <header id="top">
    <div class="top-inner">
      <div class="title-row">
        <span class="mark" aria-hidden="true"></span>
        <h1>{{TITLE}}</h1>
        <button type="button" class="icon-btn" id="font-btn" aria-label="切换字号">字·标准</button>
        <button type="button" class="icon-btn" id="theme-btn" aria-label="切换颜色主题">主题</button>
      </div>
      <div class="clocks" id="clocks" aria-label="双时区时钟"></div>
      <div id="nextbar" aria-live="polite"></div>
    </div>
  </header>
  <main id="main" class="view">
    <noscript><p class="empty">这个页面需要启用 JavaScript 才能显示行程。</p></noscript>
  </main>
  <nav class="tabbar" aria-label="主导航">
    <div class="tabbar-inner" id="tabbar-inner"></div>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="trip-data">{{DATA}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
